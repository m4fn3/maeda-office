baseURL = 'https://tax-maeda.com/'
languageCode = 'ja'
defaultContentLanguage = 'ja'
title = '前田武志税理士事務所'
hasCJKLanguage = true # 日本語の要約・文字数カウントを正しく扱う
timeZone = 'Asia/Tokyo' # 日付を +09:00 で出力する

# タグは使わない（記事は「テーマのハブ」＝ content/guide/<ハブ>/ のディレクトリで分類する）
disableKinds = ['taxonomy', 'term']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # MarkdownでHTMLを許可
    [markup.goldmark.extensions.cjk] # 日本語の文中の改行を空白にしない
      enable = true
      eastAsianLineBreaks = true
  [markup.tableOfContents] # 記事の目次は章（##）だけ、番号付き
    startLevel = 2
    endLevel = 2
    ordered = true

# /llms.txt を出力する（layouts/index.llms.txt）
[outputFormats]
  [outputFormats.LLMS]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'LLMS']

# サイト全体で使う情報。JSON-LD・OGP・フッター・llms.txt から参照する。
# ここを変えれば、構造化データと画面表示が同時に変わる（食い違いを防ぐ）。
[params]
  description = '神戸市東灘区の税理士事務所です。法人設立・個人事業の開業、会計・税務のご相談、経理指導、申告書作成、M&A・上場準備のご相談に対応します。'
  homeTitle = '神戸市東灘区の税理士｜前田武志税理士事務所'
  ogImage = 'images/og.png'
  knowsAbout = ['法人設立', '個人事業の開業', '会計', '税務', '経理指導', '法人税', '消費税', '所得税', '青色申告', '給与・源泉徴収', 'M&A', '上場準備']
  # Search Console / Bing Webmaster の所有権確認（メタタグ方式）。取得したら値を入れる。
  googleSiteVerification = ''
  bingSiteVerification = ''

  # 業務内容（トップ・業務内容ページ・JSON-LD の hasOfferCatalog・llms.txt で共通に使う）
  # path は個別ページ（content/service/<名前>.md）。topic はお問い合わせフォームの「ご相談内容」の値と対応する。
  [[params.services]]
    name = '顧問契約（会計・税務・経理指導）'
    path = '/service/komon/'
    topic = 'komon'
    summary = '会計・税務のご相談、経理指導・代行、法人税・消費税・所得税等の申告書作成を、継続的にお手伝いします。'
  [[params.services]]
    name = '上場準備・M&Aのご相談'
    path = '/service/ipo-ma/'
    topic = 'ipo-ma'
    summary = '上場準備に伴う管理体制の整備や、Ｍ＆Ａ（買収調査・交渉）に関するご相談をお受けします。'
  [[params.services]]
    name = '開業・法人設立のご相談'
    path = '/service/kaigyo-setsuritsu/'
    topic = 'kaigyo'
    summary = '個人事業の開業、法人設立のご相談と、あわせて必要となる各種届出をお手伝いします。'
  [[params.services]]
    name = '給与・年末調整のご相談'
    path = '/service/kyuyo-nenmatsu/'
    topic = 'kyuyo'
    summary = '給与にまつわる源泉徴収・年末調整・給与支払報告書などのご相談をお受けします。'

  [params.office]
    name = '前田武志税理士事務所'
    nameEn = 'Takeshi Maeda TAX Accountant Office'
    foundingYear = 2024
    postalCode = '658-0015'
    region = '兵庫県'
    locality = '神戸市東灘区'
    street = '本山南町9-1-7 エヌヴィ神戸本山504号'
    streetDisplay = '本山南町９丁目１−７'
    building = 'エヌヴィ神戸本山 ５０４号'
    hours = '9:30〜17:30'
    hoursNote = '不定休'
    # 営業日は毎日（不定休）。JSON-LD の openingHoursSpecification に使う。
    opens = '09:30'
    closes = '17:30'
    areaNote = '事務所は神戸市東灘区にあります。所在地を問わず、お気軽にご相談ください。'

  [params.person]
    name = '前田武志'
    nameEn = 'Takeshi Maeda'
    jobTitle = '税理士'
    registrationNumber = '153773'
    association = '近畿税理士会'
