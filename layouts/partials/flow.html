{{- /* ご相談の流れ（トップ・業務内容・お問い合わせで共通）。文面を変えるときはここだけ直す */ -}}
<ol class="steps_list">
    <li>
        <span class="steps_title">お問い合わせ</span>
        <span class="steps_text">フォームから、ご相談の内容と現在の状況をお知らせください。まだ考えがまとまっていない段階でもかまいません。</span>
    </li>
    <li>
        <span class="steps_title">ご連絡・お話を伺う</span>
        <span class="steps_text">内容を確認のうえ、メールでご連絡します。必要に応じて、面談で詳しくお伺いします。</span>
    </li>
    <li>
        <span class="steps_title">ご提案・お見積り</span>
        <span class="steps_text">お手伝いできる内容と業務の範囲、費用をご提示します。</span>
    </li>
    <li>
        <span class="steps_title">ご契約・業務開始</span>
        <span class="steps_text">ご納得いただけましたら、ご契約のうえ業務を始めます。</span>
    </li>
</ol>
