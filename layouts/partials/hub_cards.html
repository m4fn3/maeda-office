{{- /* 税務ガイドのテーマ（ハブ）のカード（トップで使う）。記事は行ごとのリンクにして、記事であることが分かるようにする。引数: hubs */ -}}
<ul class="cards cards_3">
    {{ range .hubs }}
    {{ $pages := .RegularPages.ByWeight }}
    <li class="card">
        <a class="card_title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <div class="card_text">{{ .Params.summary }}</div>
        <ul class="hub_card_articles">
            {{ range $pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
        </ul>
        <a class="text_link" href="{{ .RelPermalink }}">記事一覧（{{ len $pages }}本）&rarr;</a>
    </li>
    {{ end }}
</ul>
