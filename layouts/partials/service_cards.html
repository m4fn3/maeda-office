{{- /* 業務内容のカード（トップ・業務内容ページで共通）。hugo.toml の [[params.services]] から作る。カード全体がリンク */ -}}
<ul class="cards">
    {{ range .Site.Params.services }}
    <li>
        <a class="card" href="{{ .path | relURL }}">
            <span class="card_title">{{ .name }}</span>
            <span class="card_text">{{ .summary }}</span>
            <span class="card_more">詳しく見る</span>
        </a>
    </li>
    {{ end }}
</ul>
