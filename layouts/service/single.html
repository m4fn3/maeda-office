{{ define "main" }}
<div class="main">
    <h1><span>業務内容</span></h1>
    <p>
        以下のような業務を請け負わせていただきますが、単に作業を機械的に行うだけでなく、個々の状況に応じた最適な方法を導き、事業発展に少しでも貢献させていただきたいと思います。
    </p>
    <ul>
        {{ range .Site.Params.services }}<li>{{ . }}</li>{{ end }}
    </ul>
    {{ with .Params.faq }}
    <h2><span>よくある質問</span></h2>
    <dl class="faq">
        {{ range . }}
        <dt>{{ .q }}</dt>
        <dd>{{ .a | markdownify }}</dd>
        {{ end }}
    </dl>
    {{ end }}
</div>
{{ end }}
